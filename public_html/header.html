<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURU Foundation - Header</title>
    <link rel="icon" type="image/png" href="NewLogo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/root.css">
    <meta name="google-site-verification" content="aXlo-cqGp6MsiAy_tNnfi3hXjgJKVxfY7gaxiQqb8Vk" />
    <script type="application/ld+json">
    {
    "@context": "https://schema.org",
    "@type": "EducationalOrganization",
    "name": "Nuru Foundation",
    "url": "https://nurufoundation.co.ke",
    "description": "Prepare your child for the future with the best online coding classes in Kenya. We teach Python, Web Design And Development, Cyber Security, Ai Essentials, Mathematics, Physics, Software Development, Soft Skills, Data Science/Engineering/Analytics, Artificial Intelligence, Robotics & Game Design to kids aged 8+. Enroll for 2026 Cohort!",
    "logo": "https://nurufoundation.co.ke/NewLogo.png",
    "address": {
        "@type": "PostalAddress",
        "addressCountry": "KE" 
    },
    "areaServed": [
        {"@type": "City", "name": "Nairobi"},
        {"@type": "City", "name": "Mombasa"},
        {"@type": "City", "name": "Kisumu"},
        {"@type": "City", "name": "Nakuru"}
    ],
    "offers": {
        "@type": "Offer",
        "priceCurrency": "KES",
        "availability": "https://schema.org/OnlineOnly"
    }
    }
    </script>
    <style>
        .main-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(138, 43, 226, 0.12);
            background-clip: padding-box;
            padding: 0.7rem 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 25px rgba(138, 43, 226, 0.08);
        }

        .main-header.scrolled {
            background: rgba(255, 255, 255, 0.98);
            padding: 0.45rem 0;
            box-shadow: 0 4px 20px rgba(138, 43, 226, 0.15);
            border-bottom-color: rgba(138, 43, 226, 0.18);
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1220px;
            margin: 0 auto;
            padding: 0 1.75rem;
            width: 100%;
            box-sizing: border-box;
            gap: 1.5rem;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            position: relative;
            padding: 2px 0;
            margin-left: 1.5rem;
            background: transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .logo:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .logo-img {
            height: 48px;
            width: auto;
            max-width: 200px;
            object-fit: contain;
            display: block;
            transition: height 0.35s ease;
        }

        .main-header.scrolled .logo-img {
            height: 40px;
        }

        .main-nav {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-list {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 0.35rem;
            margin: 0;
            padding: 0.35rem 0.5rem;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(138, 43, 226, 0.12);
        }

        .nav-link {
            color: var(--dark, #2D3047);
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.93rem;
            font-weight: 500;
            padding: 0.5rem 1.15rem;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8A2BE2 0%, #00CED1 100%);
            transition: left 0.3s ease;
            z-index: -1;
            border-radius: 8px;
        }

        .nav-link:hover::before,
        .nav-link.active::before {
            left: 0;
        }

        .nav-link:hover,
        .nav-link.active {
            color: #FFFFFF;
            transform: translateY(-1px);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-shrink: 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.55rem 1.35rem;
            border-radius: 10px;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.93rem;
            font-weight: 600;
            line-height: 1.2;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8A2BE2 0%, #00CED1 100%);
            transition: left 0.3s ease;
            z-index: -1;
            border-radius: 10px;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn-outline {
            background: transparent;
            color: #8A2BE2;
            border-color: #8A2BE2;
        }

        .btn-outline:hover {
            color: #FFFFFF;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #8A2BE2 0%, #00CED1 100%);
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(138, 43, 226, 0.4);
        }

        .nav-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            padding: 0.5rem;
            border-radius: 10px;
            background: linear-gradient(135deg, #8A2BE2 0%, #00CED1 100%);
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: none;
            outline: none;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
            flex-shrink: 0;
        }

        .nav-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.4);
        }

        .nav-toggle span {
            width: 22px;
            height: 2.5px;
            background: #FFFFFF;
            border-radius: 2px;
            transition: all 0.3s ease;
            transform-origin: center;
            display: block;
        }

        .mobile-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            z-index: 1001;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        .mobile-menu.active {
            transform: translateX(0);
        }

        .mobile-menu-brand {
            margin-bottom: 2rem;
            padding: 0;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-logo-img {
            height: 52px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            display: block;
        }

        .mobile-nav-list {
            list-style: none;
            text-align: center;
            gap: 1.25rem;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 320px;
        }

        .mobile-nav-link {
            color: #2D3047;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            display: block;
            text-align: center;
        }

        .mobile-nav-link:hover,
        .mobile-nav-link.active {
            background: linear-gradient(135deg, #8A2BE2 0%, #00CED1 100%);
            color: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.25);
        }

        .mobile-actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            max-width: 260px;
        }

        .mobile-actions .btn {
            text-align: center;
            width: 100%;
        }

        .close-menu {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: linear-gradient(135deg, #8A2BE2 0%, #00CED1 100%);
            color: #FFFFFF;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.25);
        }

        .close-menu:hover {
            transform: rotate(90deg) scale(1.08);
        }

        @media (max-width: 1100px) and (min-width: 901px) {
            .navbar {
                padding: 0 1.25rem;
                gap: 0.75rem;
            }

            .logo {
                padding: 5px 12px;
            }

            .logo-img {
                height: 38px;
            }

            .nav-list {
                gap: 0.2rem;
                padding: 0.35rem 0.5rem;
            }

            .nav-link {
                padding: 0.5rem 0.9rem;
                font-size: 0.88rem;
            }

            .header-actions {
                gap: 0.5rem;
            }

            .btn {
                padding: 0.5rem 1.15rem;
                font-size: 0.88rem;
            }
        }

        @media (max-width: 900px) {
            .navbar {
                padding: 0 1.25rem;
            }

            .logo {
                margin-left: 0;
            }

            .nav-list,
            .header-actions {
                display: none;
            }

            .nav-toggle {
                display: flex;
            }

            .logo-img {
                height: 42px;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 0 0.85rem;
            }

            .logo {
                padding: 2px 0;
            }

            .logo-img {
                height: 38px;
                max-width: 170px;
            }

            .nav-toggle {
                width: 40px;
                height: 40px;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .main-header {
            animation: slideDown 0.5s ease-out;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="navbar">
            <a href="index.html" class="logo" aria-label="Nuru Foundation Home">
                <img src="NewLogo.png" alt="Nuru Foundation Logo" class="logo-img">
            </a>

            <nav class="main-nav" aria-label="Main Navigation">
                <ul class="nav-list" id="navList">
                    <li><a href="index.html" class="nav-link active">Home</a></li>
                    <li><a href="about.html" class="nav-link">About Us</a></li>
                    <li><a href="courses.html" class="nav-link">Courses</a></li>
                    <li><a href="calender.html" class="nav-link">Calender</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>

            <div class="header-actions" id="headerActions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="apply-now-bt.html" class="btn btn-primary">Get Started</a>
            </div>

            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" type="button">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="mobile-menu" id="mobileMenu">
            <button class="close-menu" id="closeMenu" aria-label="Close navigation menu" type="button">
                <i class="fas fa-times"></i>
            </button>
            <div class="mobile-menu-brand">
                <img src="NewLogo.png" alt="Nuru Foundation Logo" class="mobile-logo-img">
            </div>
            <ul class="mobile-nav-list">
                <li><a href="index.html" class="mobile-nav-link active">Home</a></li>
                <li><a href="about.html" class="mobile-nav-link">About Us</a></li>
                <li><a href="courses.html" class="mobile-nav-link">Courses</a></li>
                <li><a href="calender.html" class="mobile-nav-link">Program Calender</a></li>
                <li><a href="contact.html" class="mobile-nav-link">Contact</a></li>
            </ul>
            <div class="mobile-actions" id="mobileActions">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="apply-now-bt.html" class="btn btn-primary">Get Started</a>
            </div>
        </div>
    </header>

    <script src="scripts/header.js"></script>
</body>
</html>
