<!DOCTYPE html>
<html lang="en">
<head>
    <script src="/scripts/auth-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollments - Tutor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../styles/root.css">
    <link rel="stylesheet" href="../styles/header.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .tutor-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .tutor-sidebar {
            width: 260px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .tutor-brand {
            padding: 0 20px 20px;
            border-bottom: 1px solid #4a8b5c;
            margin-bottom: 20px;
        }

        .tutor-brand h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .tutor-brand p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .tutor-nav {
            list-style: none;
            padding: 0 10px;
        }

        .tutor-nav li {
            margin-bottom: 5px;
        }

        .tutor-nav a {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #ecf0f1;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tutor-nav a:hover,
        .tutor-nav a.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .tutor-nav i {
            width: 20px;
            margin-right: 10px;
            font-size: 1.1rem;
        }

        /* Main Content */
        .tutor-main {
            flex: 1;
            margin-left: 260px;
            padding: 20px;
        }

        .tutor-header {
            background: white;
            padding: 25px 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tutor-header h1 {
            color: #27ae60;
            font-size: 2rem;
            margin-bottom: 0;
        }

        .header-actions {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        /* Filters and Search */
        .filters-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .filters-row {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
        }

        .filter-select {
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            min-width: 150px;
        }

        /* Enrollments Table */
        .enrollments-table {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-header {
            background: #f8f9fa;
            padding: 20px;
            border-bottom: 2px solid #e9ecef;
        }

        .table-header h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .table-stats {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: #6c757d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .student-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .student-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1rem;
        }

        .student-details h4 {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
        }

        .student-details p {
            margin: 0;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .course-info {
            max-width: 200px;
        }

        .course-title {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .enrollment-date {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .enrollment-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .enrollment-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view {
            background: #3498db;
            color: white;
        }

        .btn-view:hover {
            background: #2980b9;
        }

        .btn-remove {
            background: #e74c3c;
            color: white;
        }

        .btn-remove:hover {
            background: #c0392b;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination-btn {
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            background: white;
            color: #6c757d;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover,
        .pagination-btn.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .pagination-info {
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* Loading and Empty States */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #6c757d;
        }

        .modal h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .enrollment-details {
            margin-bottom: 30px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .detail-label {
            font-weight: 500;
            color: #2c3e50;
        }

        .detail-value {
            color: #6c757d;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #2c3e50;
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Student Search Combobox */
        .student-combobox {
            position: relative;
        }

        .student-combobox input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .student-combobox input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .student-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 20;
            max-height: 240px;
            overflow-y: auto;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .student-dropdown.open {
            display: block;
        }

        .student-option {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #f1f3f5;
        }

        .student-option:last-child {
            border-bottom: none;
        }

        .student-option:hover,
        .student-option.active {
            background: #f1f6ff;
        }

        .student-option .option-name {
            font-weight: 500;
            color: #2c3e50;
        }

        .student-option .option-email {
            font-size: 0.85rem;
            color: #6c757d;
        }

        .student-dropdown-message {
            padding: 12px;
            color: #6c757d;
            font-size: 0.9rem;
            text-align: center;
        }

        .student-hint {
            display: block;
            margin-top: 6px;
            color: #6c757d;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .tutor-container {
                flex-direction: column;
            }

            .tutor-sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .tutor-main {
                margin-left: 0;
            }

            .tutor-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .filters-row {
                flex-direction: column;
                align-items: stretch;
            }

            .table-responsive {
                overflow-x: auto;
            }

            .student-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .enrollment-actions {
                flex-direction: column;
            }

            .modal-content {
                margin: 10% auto;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div class="tutor-container">
        <!-- Sidebar -->
        <nav class="tutor-sidebar">
            <div class="tutor-brand">
                <h1>NURU Tutor</h1>
                <p>Teaching Dashboard</p>
            </div>
            <ul class="tutor-nav">
                <li><a href="index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                <li><a href="courses.html"><i class="fas fa-book"></i> My Courses</a></li>
                <li><a href="lessons.html"><i class="fas fa-chalkboard-teacher"></i> Lessons</a></li>
                <li><a href="assignments.html"><i class="fas fa-tasks"></i> Assignments</a></li>
                <li><a href="submissions.html"><i class="fas fa-file-alt"></i> Submissions</a></li>
                <li><a href="enrollments.html" class="active"><i class="fas fa-clipboard-list"></i> Enrollments</a></li>
                <li><a href="notes.html"><i class="fas fa-sticky-note"></i> Course Notes</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="tutor-main">
            <div class="tutor-header">
                <h1>Course Enrollments</h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="refreshEnrollments()">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                    <button class="btn btn-primary" onclick="openAddEnrollmentModal()">
                        <i class="fas fa-user-plus"></i> Add Enrollment
                    </button>
                </div>
            </div>

            <!-- Filters and Search -->
            <div class="filters-section">
                <div class="filters-row">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search by student name, email, or course..." oninput="handleEnrollmentSearch()" autocomplete="off">
                        <i class="fas fa-search"></i>
                    </div>
                    <select class="filter-select" id="courseFilter" onchange="loadEnrollments(1)">
                        <option value="">All Courses</option>
                    </select>
                </div>
            </div>

            <!-- Enrollments Table -->
            <div id="enrollmentsContainer">
                <div class="loading">Loading enrollments...</div>
            </div>

            <!-- Pagination -->
            <div class="pagination" id="paginationContainer" style="display: none;">
                <button class="pagination-btn" id="prevBtn" onclick="changePage(currentPage - 1)">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
                <span class="pagination-info" id="paginationInfo"></span>
                <button class="pagination-btn" id="nextBtn" onclick="changePage(currentPage + 1)">
                    Next <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </main>
    </div>

    <!-- Enrollment Details Modal -->
    <div id="enrollmentModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2>Enrollment Details</h2>
            <div id="enrollmentDetails">
                <div class="loading">Loading enrollment details...</div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
                <button type="button" class="btn btn-remove" id="removeBtn" onclick="removeEnrollment()">
                    <i class="fas fa-user-times"></i> Remove Enrollment
                </button>
            </div>
        </div>
    </div>

    <!-- Add Enrollment Modal -->
    <div id="addEnrollmentModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeAddModal()">&times;</span>
            <h2>Enroll Student in Course</h2>
            <form id="addEnrollmentForm">
                <div class="form-group">
                    <label for="studentSearch">Search Student *</label>
                    <div class="student-combobox">
                        <input type="text" id="studentSearch" placeholder="Type a student's name or email..." autocomplete="off" required>
                        <input type="hidden" id="studentSelect">
                        <div id="studentDropdown" class="student-dropdown"></div>
                    </div>
                    <small id="studentHint" class="student-hint"></small>
                </div>
                <div class="form-group">
                    <label for="courseSelect">Select Course *</label>
                    <select id="courseSelect" required>
                        <option value="">Loading courses...</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeAddModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Enroll Student
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
    const API_BASE_URL = '/api';

    let currentPage = 1;
    let totalPages = 1;
    let allEnrollments = [];
    let filteredEnrollments = [];
    let courses = [];
    let enrollmentSearchTimer = null;

    document.addEventListener('DOMContentLoaded', function() {
        initializeEnrollmentsPage();
    });

    function initializeEnrollmentsPage() {
        console.log('ðŸ”„ Initializing enrollments page...');

        // Wait a bit for auth state to stabilize
        setTimeout(() => {
            checkTutorAccess();
        }, 100);
    }

    function checkTutorAccess() {
        const token = sessionStorage.getItem('token');
        const userData = sessionStorage.getItem('user');

        if (!token || !userData) {
            window.location.href = '/login.html';
            return;
        }

        try {
            const user = JSON.parse(userData);
            const userRole = user.role?.name || user.role;

            if (userRole !== 'tutor') {
                if (userRole === 'admin') {
                    window.location.href = '/admin-dashboard/enrollments.html';
                } else {
                    window.location.href = '/dashboard.html';
                }
                return;
            }

            loadCourses();
            loadEnrollments();
        } catch (error) {
            console.error('Error parsing user data:', error);
            window.location.href = '/login.html';
        }
    }

    async function loadCourses() {
        try {
            const token = sessionStorage.getItem('token');
            const response = await fetch(`${API_BASE_URL}/tutor/courses?page=1&limit=100`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const data = await response.json();
                courses = data.data || [];
                populateCourseFilter();
            }
        } catch (error) {
            console.error('Error loading courses:', error);
        }
    }

    function populateCourseFilter() {
        const courseFilter = document.getElementById('courseFilter');
        courseFilter.innerHTML = '<option value="">All Courses</option>';

        courses.forEach(course => {
            const option = document.createElement('option');
            option.value = course.id;
            option.textContent = course.title;
            courseFilter.appendChild(option);
        });
    }

    // Searchable student combobox (server-side search)
    let studentSearchTimer = null;
    let studentRequestSeq = 0;
    let studentResults = [];
    let activeStudentIndex = -1;

    async function loadStudents(query = '') {
        const dropdown = document.getElementById('studentDropdown');
        const hint = document.getElementById('studentHint');
        const requestId = ++studentRequestSeq;

        dropdown.innerHTML = '<div class="student-dropdown-message"><i class="fas fa-spinner fa-spin"></i> Searching students...</div>';
        dropdown.classList.add('open');
        if (hint) hint.textContent = '';

        try {
            const token = sessionStorage.getItem('token');
            const url = `${API_BASE_URL}/tutor/students${query ? `?search=${encodeURIComponent(query)}` : ''}`;
            const response = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error('Failed to load students');
            }

            const data = await response.json();

            // Ignore responses from outdated requests
            if (requestId !== studentRequestSeq) return;

            studentResults = data.data || [];
            renderStudentOptions();
        } catch (error) {
            if (requestId !== studentRequestSeq) return;
            console.error('Error loading students:', error);
            studentResults = [];
            dropdown.innerHTML = '<div class="student-dropdown-message">Error loading students</div>';
            dropdown.classList.add('open');
        }
    }

    function renderStudentOptions() {
        const dropdown = document.getElementById('studentDropdown');
        activeStudentIndex = -1;

        if (!studentResults.length) {
            dropdown.innerHTML = '<div class="student-dropdown-message">No students found</div>';
            dropdown.classList.add('open');
            return;
        }

        dropdown.innerHTML = studentResults.map((student, index) => `
            <div class="student-option" data-index="${index}" data-id="${student.id}">
                <div class="option-name">${escapeHtml(student.fullName || student.username || 'Unknown student')}</div>
                <div class="option-email">${escapeHtml(student.email || '')}</div>
            </div>
        `).join('');

        dropdown.querySelectorAll('.student-option').forEach(option => {
            option.addEventListener('mousedown', function(e) {
                e.preventDefault();
                selectStudent(Number(this.dataset.id));
            });
        });

        dropdown.classList.add('open');
    }

    function selectStudent(studentId) {
        const student = studentResults.find(s => Number(s.id) === studentId);
        if (!student) return;

        document.getElementById('studentSelect').value = student.id;
        document.getElementById('studentSearch').value = `${student.fullName || student.username} (${student.email || ''})`;
        document.getElementById('studentHint').textContent = 'Student selected';
        closeStudentDropdown();
    }

    function closeStudentDropdown() {
        const dropdown = document.getElementById('studentDropdown');
        dropdown.classList.remove('open');
        dropdown.querySelectorAll('.student-option.active').forEach(el => el.classList.remove('active'));
        activeStudentIndex = -1;
    }

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    document.getElementById('studentSearch').addEventListener('input', function() {
        document.getElementById('studentSelect').value = '';
        document.getElementById('studentHint').textContent = '';

        const query = this.value.trim();
        clearTimeout(studentSearchTimer);
        studentSearchTimer = setTimeout(() => loadStudents(query), 300);
    });

    document.getElementById('studentSearch').addEventListener('focus', function() {
        const dropdown = document.getElementById('studentDropdown');
        if (!dropdown.classList.contains('open')) {
            loadStudents(this.value.trim());
        }
    });

    document.getElementById('studentSearch').addEventListener('keydown', function(e) {
        const dropdown = document.getElementById('studentDropdown');
        const options = dropdown.querySelectorAll('.student-option');

        if (e.key === 'Escape') {
            closeStudentDropdown();
            return;
        }

        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            if (!dropdown.classList.contains('open')) {
                loadStudents(this.value.trim());
                return;
            }
            if (!options.length) return;

            e.preventDefault();
            activeStudentIndex = e.key === 'ArrowDown'
                ? (activeStudentIndex + 1) % options.length
                : (activeStudentIndex - 1 + options.length) % options.length;

            options.forEach((option, index) => {
                option.classList.toggle('active', index === activeStudentIndex);
            });
            options[activeStudentIndex].scrollIntoView({ block: 'nearest' });
            return;
        }

        if (e.key === 'Enter' && activeStudentIndex >= 0 && options[activeStudentIndex]) {
            e.preventDefault();
            selectStudent(Number(options[activeStudentIndex].dataset.id));
        }
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.student-combobox')) {
            closeStudentDropdown();
        }
    });

    function populateCourseSelect() {
        const courseSelect = document.getElementById('courseSelect');
        courseSelect.innerHTML = '<option value="">Select a course</option>';
        
        courses.forEach(course => {
            const option = document.createElement('option');
            option.value = course.id;
            option.textContent = course.title;
            courseSelect.appendChild(option);
        });
    }

    async function loadEnrollments(page = 1) {
        const container = document.getElementById('enrollmentsContainer');
        container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading enrollments...</div>';
        
        try {
            const token = sessionStorage.getItem('token');
            const searchTerm = document.getElementById('searchInput').value;
            const courseFilter = document.getElementById('courseFilter').value;

            // Build URL with filters
            let url = `${API_BASE_URL}/tutor/enrollments?page=${page}&limit=20`;
            if (searchTerm) {
                url += `&search=${encodeURIComponent(searchTerm)}`;
            }
            if (courseFilter) {
                url += `&courseId=${courseFilter}`;
            }

            console.log('ðŸ” Loading enrollments from:', url);

            const response = await fetch(url, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const data = await response.json();
                console.log('âœ… Enrollments loaded:', data);
                
                if (data.success) {
                    allEnrollments = data.data || [];
                    filteredEnrollments = allEnrollments;

                    currentPage = data.pagination?.page || 1;
                    totalPages = data.pagination?.pages || 1;

                    displayEnrollments(filteredEnrollments);
                    updatePagination(data.pagination);
                } else {
                    throw new Error(data.error || 'Failed to load enrollments');
                }
            } else {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.error || `HTTP ${response.status}: Failed to load enrollments`);
            }
        } catch (error) {
            console.error('âŒ Error loading enrollments:', error);
            container.innerHTML = `
                <div class="error" style="text-align: center; padding: 40px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 3rem; margin-bottom: 15px;"></i>
                    <h3>Failed to load enrollments</h3>
                    <p>${error.message}</p>
                    <button class="btn btn-primary" onclick="loadEnrollments(1)" style="margin-top: 15px;">
                        <i class="fas fa-redo"></i> Try Again
                    </button>
                </div>`;
        }
    }

    function displayEnrollments(enrollments) {
        const container = document.getElementById('enrollmentsContainer');

        if (!enrollments || enrollments.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-clipboard-list"></i>
                    <h3>No enrollments found</h3>
                    <p>No students have enrolled in your courses yet.</p>
                    <button class="btn btn-primary" onclick="openAddEnrollmentModal()" style="margin-top: 15px;">
                        <i class="fas fa-user-plus"></i> Add First Enrollment
                    </button>
                </div>
            `;
            return;
        }

        const totalEnrollments = allEnrollments.length;
        const uniqueStudents = new Set(allEnrollments.map(e => e.student.id)).size;

        container.innerHTML = `
            <div class="enrollments-table">
                <div class="table-header">
                    <h2>Student Enrollments</h2>
                    <div class="table-stats">
                        <span><i class="fas fa-users"></i> ${uniqueStudents} Students</span>
                        <span><i class="fas fa-clipboard-list"></i> ${totalEnrollments} Enrollments</span>
                    </div>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Student</th>
                                <th>Course</th>
                                <th>Enrollment Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${enrollments.map(enrollment => `
                                <tr>
                                    <td>
                                        <div class="student-info">
                                            <div class="student-avatar">
                                                ${enrollment.student.fullName.charAt(0).toUpperCase()}
                                            </div>
                                            <div class="student-details">
                                                <h4>${enrollment.student.fullName}</h4>
                                                <p>${enrollment.student.email}</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="course-info">
                                            <div class="course-title">${enrollment.course.title}</div>
                                        </div>
                                    </td>
                                    <td>
                                        <div class="enrollment-date">
                                            ${new Date(enrollment.enrolledAt).toLocaleDateString()}
                                        </div>
                                    </td>
                                    <td>
                                        <span class="enrollment-status status-active">Active</span>
                                    </td>
                                    <td>
                                        <div class="enrollment-actions">
                                            <button class="action-btn btn-view" onclick="viewEnrollment(${enrollment.id})">
                                                <i class="fas fa-eye"></i> View
                                            </button>
                                            <button class="action-btn btn-remove" onclick="confirmRemoveEnrollment(${enrollment.id}, '${enrollment.student.fullName}', '${enrollment.course.title}')">
                                                <i class="fas fa-user-times"></i> Remove
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    function updatePagination(pagination) {
        const container = document.getElementById('paginationContainer');
        const info = document.getElementById('paginationInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        if (!pagination || pagination.pages <= 1) {
            container.style.display = 'none';
            return;
        }

        container.style.display = 'flex';
        info.textContent = `Page ${pagination.page} of ${pagination.pages} (${pagination.total} enrollments)`;

        prevBtn.disabled = pagination.page <= 1;
        nextBtn.disabled = pagination.page >= pagination.pages;
    }

    function changePage(page) {
        if (page < 1 || page > totalPages) return;
        loadEnrollments(page);
    }

    function handleEnrollmentSearch() {
        clearTimeout(enrollmentSearchTimer);
        enrollmentSearchTimer = setTimeout(() => loadEnrollments(1), 300);
    }

    function refreshEnrollments() {
        loadEnrollments(currentPage);
    }

    function openAddEnrollmentModal() {
        document.getElementById('addEnrollmentForm').reset();
        document.getElementById('studentHint').textContent = '';
        closeStudentDropdown();
        loadStudents('');
        populateCourseSelect();
        document.getElementById('addEnrollmentModal').style.display = 'flex';
    }

    function closeAddModal() {
        document.getElementById('addEnrollmentModal').style.display = 'none';
        document.getElementById('addEnrollmentForm').reset();
        document.getElementById('studentHint').textContent = '';
        clearTimeout(studentSearchTimer);
        closeStudentDropdown();
    }

    async function viewEnrollment(enrollmentId) {
        try {
            const token = sessionStorage.getItem('token');
            const response = await fetch(`${API_BASE_URL}/tutor/enrollments/${enrollmentId}`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                const data = await response.json();
                if (data.success) {
                    const enrollment = data.data;
                    
                    document.getElementById('enrollmentDetails').innerHTML = `
                        <div class="enrollment-details">
                            <div class="detail-row">
                                <span class="detail-label">Student Name:</span>
                                <span class="detail-value">${enrollment.student.fullName}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Email:</span>
                                <span class="detail-value">${enrollment.student.email}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Username:</span>
                                <span class="detail-value">${enrollment.student.username}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Course:</span>
                                <span class="detail-value">${enrollment.course.title}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Category:</span>
                                <span class="detail-value">${enrollment.course.category || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Level:</span>
                                <span class="detail-value">${enrollment.course.level || 'N/A'}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Enrollment Date:</span>
                                <span class="detail-value">${new Date(enrollment.enrolledAt).toLocaleDateString()}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Student Since:</span>
                                <span class="detail-value">${new Date(enrollment.student.createdAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                    `;

                    document.getElementById('enrollmentModal').dataset.enrollmentId = enrollmentId;
                    document.getElementById('enrollmentModal').style.display = 'flex';
                }
            } else {
                throw new Error('Failed to load enrollment details');
            }
        } catch (error) {
            console.error('Error loading enrollment details:', error);
            document.getElementById('enrollmentDetails').innerHTML = `
                <div class="error">Failed to load enrollment details.</div>
            `;
        }
    }

    function confirmRemoveEnrollment(enrollmentId, studentName, courseTitle) {
        if (confirm(`Are you sure you want to remove ${studentName} from "${courseTitle}"? This action cannot be undone.`)) {
            removeEnrollment(enrollmentId);
        }
    }

    async function removeEnrollment(enrollmentId) {
        const id = enrollmentId || document.getElementById('enrollmentModal').dataset.enrollmentId;

        try {
            const token = sessionStorage.getItem('token');
            const response = await fetch(`${API_BASE_URL}/tutor/enrollments/${id}`, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                alert('Enrollment removed successfully!');
                closeModal();
                loadEnrollments(currentPage);
            } else {
                throw new Error('Failed to remove enrollment');
            }
        } catch (error) {
            console.error('Error removing enrollment:', error);
            alert('Failed to remove enrollment. Please try again.');
        }
    }

    function closeModal() {
        document.getElementById('enrollmentModal').style.display = 'none';
        delete document.getElementById('enrollmentModal').dataset.enrollmentId;
    }

    // Handle form submission for new enrollment
    document.getElementById('addEnrollmentForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const studentId = document.getElementById('studentSelect').value;
        const courseId = document.getElementById('courseSelect').value;
        
        if (!studentId || !courseId) {
            alert('Please select both student and course');
            return;
        }
        
        await createEnrollment(parseInt(studentId), parseInt(courseId));
    });

    async function createEnrollment(studentId, courseId) {
        try {
            const token = sessionStorage.getItem('token');
            const response = await fetch(`${API_BASE_URL}/tutor/enrollments`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    studentId: studentId,
                    courseId: courseId
                })
            });

            if (response.ok) {
                const data = await response.json();
                if (data.success) {
                    alert('Student enrolled successfully!');
                    closeAddModal();
                    loadEnrollments(currentPage); // Refresh the list
                } else {
                    throw new Error(data.error || 'Failed to enroll student');
                }
            } else {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Failed to enroll student');
            }
        } catch (error) {
            console.error('Error creating enrollment:', error);
            alert(`Failed to enroll student: ${error.message}`);
        }
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/login.html';
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        const enrollmentModal = document.getElementById('enrollmentModal');
        const addEnrollmentModal = document.getElementById('addEnrollmentModal');
        
        if (event.target === enrollmentModal) {
            closeModal();
        }
        if (event.target === addEnrollmentModal) {
            closeAddModal();
        }
    };
    </script>
<script>function logout(){localStorage.clear();sessionStorage.clear();location.replace('/login.html')}</script>
</body>
